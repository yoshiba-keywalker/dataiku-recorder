<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>接客メモ録音ツール</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0F1117;
  --surface:#1A1D27;
  --surface2:#22263A;
  --border:#2E3352;
  --blue:#4A8FE7;
  --blue-dim:#1E3A6E;
  --red:#E74A4A;
  --red-dim:#6E1E1E;
  --green:#4AE78A;
  --green-dim:#1E6E42;
  --text:#E8EAF6;
  --text2:#8B92B8;
  --text3:#4A5070;
  --radius:16px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
  display:flex;
  flex-direction:column;
}
.header{
  padding:16px 20px 12px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--surface);
}
.logo{
  font-size:13px;
  font-weight:600;
  color:var(--blue);
  letter-spacing:.05em;
}
.session-badge{
  font-size:11px;
  color:var(--text3);
  background:var(--surface2);
  padding:3px 10px;
  border-radius:20px;
  border:1px solid var(--border);
}
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 20px;
  gap:20px;
  max-width:520px;
  margin:0 auto;
  width:100%;
}

/* 録音ボタン */
.rec-area{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  width:100%;
}
.rec-btn{
  width:120px;
  height:120px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.04em;
  transition:all .2s;
  position:relative;
  outline:none;
  -webkit-tap-highlight-color:transparent;
}
.rec-btn.idle{
  background:var(--blue);
  color:#fff;
  box-shadow:0 0 0 0 rgba(74,143,231,0.4);
}
.rec-btn.idle:active{transform:scale(0.95);}
.rec-btn.recording{
  background:var(--red);
  color:#fff;
  animation:pulse 1.5s ease-in-out infinite;
}
.rec-btn.recording:active{transform:scale(0.95);}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(231,74,74,0.5);}
  50%{box-shadow:0 0 0 20px rgba(231,74,74,0);}
}
.rec-icon{font-size:32px;}
.rec-timer{
  font-size:28px;
  font-weight:300;
  color:var(--text2);
  letter-spacing:.1em;
  font-variant-numeric:tabular-nums;
  min-width:80px;
  text-align:center;
}
.rec-timer.active{color:var(--red);}
.rec-status{
  font-size:12px;
  color:var(--text3);
}

/* 文字起こしエリア */
.transcript-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  border-bottom:1px solid var(--border);
}
.card-title{
  font-size:12px;
  font-weight:600;
  color:var(--text2);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.card-actions{display:flex;gap:8px;}
.icon-btn{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text2);
  font-size:12px;
  padding:4px 10px;
  border-radius:8px;
  cursor:pointer;
  transition:all .15s;
  font-family:inherit;
}
.icon-btn:hover{background:var(--border);color:var(--text);}
.icon-btn.primary{background:var(--blue-dim);border-color:var(--blue);color:var(--blue);}
.icon-btn.primary:hover{background:var(--blue);color:#fff;}
.transcript-body{
  padding:16px;
  min-height:140px;
  max-height:280px;
  overflow-y:auto;
}
#transcript-text{
  font-size:14px;
  line-height:1.8;
  color:var(--text);
  white-space:pre-wrap;
  outline:none;
  min-height:100px;
}
#transcript-text:empty::before{
  content:'録音を開始すると、ここにテキストが表示されます...';
  color:var(--text3);
  pointer-events:none;
}
.interim{color:var(--text3);font-style:italic;}

/* メモエリア */
.memo-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
#memo-text{
  width:100%;
  background:transparent;
  border:none;
  color:var(--text);
  font-size:14px;
  line-height:1.8;
  padding:16px;
  resize:none;
  outline:none;
  font-family:inherit;
  min-height:80px;
}
#memo-text::placeholder{color:var(--text3);}

/* アクションエリア */
.actions{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.action-btn{
  width:100%;
  padding:14px;
  border-radius:var(--radius);
  border:none;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:all .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  letter-spacing:.02em;
  -webkit-tap-highlight-color:transparent;
}
.action-btn.claude{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
}
.action-btn.claude:hover{border-color:var(--blue);color:var(--blue);}
.action-btn.form{
  background:var(--blue);
  color:#fff;
}
.action-btn.form:hover{background:#3A7FD7;}
.action-btn:disabled{opacity:.4;cursor:not-allowed;}

/* コピー完了トースト */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--green-dim);
  border:1px solid var(--green);
  color:var(--green);
  font-size:13px;
  padding:10px 20px;
  border-radius:40px;
  transition:transform .3s ease;
  pointer-events:none;
  white-space:nowrap;
  z-index:100;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* セッション履歴 */
.history-card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.history-list{
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:200px;
  overflow-y:auto;
}
.history-item{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
  transition:border-color .15s;
}
.history-item:hover{border-color:var(--blue);}
.history-meta{font-size:11px;color:var(--text3);margin-bottom:4px;}
.history-preview{font-size:12px;color:var(--text2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.empty-history{padding:16px;text-align:center;font-size:12px;color:var(--text3);}
</style>
</head>
<body>

<div class="header">
  <span class="logo">🎙 接客メモ</span>
  <span class="session-badge" id="session-count">本日 0件</span>
</div>

<div class="main">

  <!-- 録音ボタン -->
  <div class="rec-area">
    <button class="rec-btn idle" id="rec-btn" onclick="toggleRecording()">
      <span class="rec-icon" id="rec-icon">🎤</span>
      <span id="rec-label">録音開始</span>
    </button>
    <div class="rec-timer" id="rec-timer">0:00</div>
    <div class="rec-status" id="rec-status">タップして録音を開始</div>
  </div>

  <!-- 文字起こし -->
  <div class="transcript-card">
    <div class="card-header">
      <span class="card-title">文字起こし</span>
      <div class="card-actions">
        <button class="icon-btn" onclick="clearTranscript()">クリア</button>
        <button class="icon-btn primary" id="copy-btn" onclick="copyTranscript()">コピー</button>
      </div>
    </div>
    <div class="transcript-body">
      <div id="transcript-text" contenteditable="true"></div>
    </div>
  </div>

  <!-- メモ欄 -->
  <div class="memo-card">
    <div class="card-header">
      <span class="card-title">補足メモ</span>
    </div>
    <textarea id="memo-text" placeholder="会社名・担当者名・気になった点など&#10;接客後に追記してください"></textarea>
  </div>

  <!-- アクション -->
  <div class="actions">
    <button class="action-btn claude" onclick="copyForClaude()">
      📋 Claudeに貼り付け用テキストをコピー
    </button>
    <button class="action-btn form" onclick="openForm()">
      📝 Googleフォームを開く
    </button>
  </div>

  <!-- セッション履歴 -->
  <div class="history-card">
    <div class="card-header">
      <span class="card-title">本日の履歴</span>
      <button class="icon-btn" onclick="clearHistory()">全削除</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-history">まだ記録がありません</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ===== 設定 =====
const FORM_URL = 'https://docs.google.com/forms/d/1nAGfdcJkHijcc075mTcVtglPRaXH1v_RQJrpCtyv760/viewform';
const CLAUDE_PROMPT = `以下は展示会での接客内容の文字起こしです。
以下の項目に整理してください：

【会社名・部署名】
【担当者のお役職】
【現状・課題】
【やりたいこと・ゴール】
【次のアクション】（商談希望/資料送付/不要）
【その他メモ】

---文字起こし---
`;

// ===== 状態 =====
let recognition = null;
let isRecording = false;
let timerInterval = null;
let elapsedSeconds = 0;
let finalTranscript = '';
let sessionCount = 0;

// ===== 音声認識初期化 =====
function initRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('⚠️ このブラウザは音声認識未対応です（Chrome推奨）');
    return null;
  }
  const r = new SpeechRecognition();
  r.lang = 'ja-JP';
  r.continuous = true;
  r.interimResults = true;

  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        finalTranscript += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    const el = document.getElementById('transcript-text');
    el.innerHTML = finalTranscript + (interim ? `<span class="interim">${interim}</span>` : '');
    el.scrollTop = el.scrollHeight;
  };

  r.onerror = (e) => {
    if (e.error === 'no-speech') return;
    showToast('認識エラー: ' + e.error);
    stopRecording();
  };

  r.onend = () => {
    if (isRecording) r.start();
  };

  return r;
}

// ===== 録音トグル =====
function toggleRecording() {
  if (!isRecording) startRecording();
  else stopRecording();
}

function startRecording() {
  recognition = initRecognition();
  if (!recognition) return;

  finalTranscript = '';
  document.getElementById('transcript-text').innerHTML = '';
  isRecording = true;

  recognition.start();

  const btn = document.getElementById('rec-btn');
  btn.className = 'rec-btn recording';
  document.getElementById('rec-icon').textContent = '⏹';
  document.getElementById('rec-label').textContent = 'タップで停止';
  document.getElementById('rec-status').textContent = '録音中...';
  document.getElementById('rec-timer').classList.add('active');

  elapsedSeconds = 0;
  timerInterval = setInterval(() => {
    elapsedSeconds++;
    const m = Math.floor(elapsedSeconds / 60);
    const s = elapsedSeconds % 60;
    document.getElementById('rec-timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function stopRecording() {
  if (!recognition) return;
  isRecording = false;
  recognition.stop();
  recognition = null;

  clearInterval(timerInterval);

  const btn = document.getElementById('rec-btn');
  btn.className = 'rec-btn idle';
  document.getElementById('rec-icon').textContent = '🎤';
  document.getElementById('rec-label').textContent = '録音開始';
  document.getElementById('rec-status').textContent = '録音完了 — 内容を確認・修正してください';
  document.getElementById('rec-timer').classList.remove('active');

  if (finalTranscript.trim()) {
    saveSession();
    showToast('✅ 録音完了！内容を確認してください');
  }
}

// ===== テキスト操作 =====
function clearTranscript() {
  finalTranscript = '';
  document.getElementById('transcript-text').innerHTML = '';
  document.getElementById('memo-text').value = '';
}

function copyTranscript() {
  const text = document.getElementById('transcript-text').innerText;
  if (!text.trim()) { showToast('テキストがありません'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('✅ テキストをコピーしました'));
}

function copyForClaude() {
  const transcript = document.getElementById('transcript-text').innerText;
  const memo = document.getElementById('memo-text').value;
  if (!transcript.trim() && !memo.trim()) { showToast('テキストがありません'); return; }

  let text = CLAUDE_PROMPT + transcript;
  if (memo.trim()) text += '\n\n---補足メモ---\n' + memo;

  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ Claudeに貼り付け用テキストをコピーしました');
  });
}

function openForm() {
  window.open(FORM_URL, '_blank');
}

// ===== 履歴 =====
function saveSession() {
  const sessions = JSON.parse(localStorage.getItem('rec_sessions') || '[]');
  const now = new Date();
  sessions.unshift({
    time: now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}),
    text: finalTranscript,
    memo: document.getElementById('memo-text').value,
    duration: elapsedSeconds
  });
  if (sessions.length > 20) sessions.pop();
  localStorage.setItem('rec_sessions', JSON.stringify(sessions));
  renderHistory();
}

function renderHistory() {
  const sessions = JSON.parse(localStorage.getItem('rec_sessions') || '[]');
  const list = document.getElementById('history-list');
  sessionCount = sessions.length;
  document.getElementById('session-count').textContent = `本日 ${sessionCount}件`;

  if (!sessions.length) {
    list.innerHTML = '<div class="empty-history">まだ記録がありません</div>';
    return;
  }

  list.innerHTML = sessions.map((s, i) => `
    <div class="history-item" onclick="loadSession(${i})">
      <div class="history-meta">${s.time} · ${Math.floor(s.duration/60)}分${s.duration%60}秒</div>
      <div class="history-preview">${s.text || '（テキストなし）'}</div>
    </div>
  `).join('');
}

function loadSession(index) {
  const sessions = JSON.parse(localStorage.getItem('rec_sessions') || '[]');
  const s = sessions[index];
  finalTranscript = s.text;
  document.getElementById('transcript-text').innerText = s.text;
  document.getElementById('memo-text').value = s.memo || '';
  showToast('📂 履歴を読み込みました');
}

function clearHistory() {
  if (!confirm('履歴を全削除しますか？')) return;
  localStorage.removeItem('rec_sessions');
  renderHistory();
}

// ===== トースト =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== 初期化 =====
renderHistory();
</script>
</body>
</html>
